# ── recency ───────────────────────────────────────────────────────────────────
recency:
  crawler_hours: 24
  email_hours: 120
  linkedin_time_range: r86400   # r86400=24h, r604800=7d, r2592000=30d

# ── scoring ───────────────────────────────────────────────────────────────────
scoring:
  weights:
    title: 30
    company: 25
    location: 20
    recency: 15
    keywords: 10

  recency_scores:
    6h: 15
    12h: 12
    24h: 8
    older: 3

  # Location fallback scores (when no score_tier matches)
  location_fallback:
    remote: 15    # remote with no specific region
    us_only: 25
    unknown: 3

  keywords:
    - llm
    - large language model
    - rag
    - retrieval
    - agent
    - transformer
    - pytorch
    - fine-tun
    - embedding
    - vector
    - diffusion
    - generative
    - reinforcement learning

# ── output ────────────────────────────────────────────────────────────────────
output:
  top_n: 50
