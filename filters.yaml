# filters.yaml — single source of truth for all job search filters.
# Edit here; no need to touch individual crawlers, ranker, or agents.

# ── locations ─────────────────────────────────────────────────────────────────
locations:
  # Keywords matched against job location strings by crawler.py
  allowed:
    - remote
    # Canada
    - canada
    - toronto
    - vancouver
    - montreal
    - ottawa
    - calgary
    - ontario
    - british columbia
    - alberta
    - quebec
    # USA
    - united states
    - usa
    - "u.s."
    - new york
    - san francisco
    - seattle
    - boston
    - chicago
    - los angeles
    - austin
    - denver
    - atlanta
    - california
    - washington
    - texas
    - massachusetts
    - illinois
    # Singapore
    - singapore
    # Malaysia
    - malaysia
    - kuala lumpur
    - penang
    # China
    - china
    - beijing
    - shanghai
    - shenzhen
    - guangzhou

  # LinkedIn search targets (crawler_linkedin.py LOCATIONS list)
  linkedin_search:
    - Canada
    - Singapore
    - Malaysia
    - China
    # - United States

  # Jobs in these locations are dropped by the ranker
  ineligible:
    - india
    - united kingdom
    - london
    - bangalore
    - hyderabad
    - mumbai
    - delhi
    - berlin
    - germany
    - australia
    - sydney
    - ireland
    - dublin
    - france
    - paris
    - netherlands
    - amsterdam
    - poland
    - warsaw

  # Scoring tiers used by ranker.py score_location()
  # Tiers are checked in order; first match wins.
  score_tiers:
    - name: canada
      terms: [canada, toronto, vancouver, montreal, ottawa, calgary,
              ontario, british columbia, alberta, quebec, waterloo]
      score: 30
    - name: singapore
      terms: [singapore]
      score: 25
    - name: malaysia
      terms: [malaysia, kuala lumpur, penang]
      score: 20
    - name: china
      terms: [china, beijing, shanghai, shenzhen, guangzhou]
      score: 18
    - name: usa
      terms: [united states, usa, "u.s.", new york, san francisco, seattle,
              boston, chicago, los angeles, austin, denver, atlanta,
              california, washington, texas, massachusetts, illinois]
      score: 25
    # "remote" and fallbacks are handled in code, not here

# ── title filters ─────────────────────────────────────────────────────────────
titles:
  allowed:
    - machine learning
    - ml engineer
    - data scientist
    - data science
    - ai engineer
    - artificial intelligence
    - applied scientist
    - applied ml
    - software engineer
    - software developer
    - sde
    - swe
    - forward deployed
    - nlp
    - computer vision
    - deep learning
    - research engineer
    - research scientist
    - platform engineer
    - backend engineer
    - full stack engineer
    - fullstack engineer
    - gen ai
    - generative ai
    - llm
    - mlops

  excluded:
    - senior
    - "sr."
    - " sr "
    - "sr "
    - staff
    - principal
    - director
    - manager
    - vice president
    - " vp "
    - head of
    - "lead "
    - " lead"
    - intern
    - internship
    - co-op
    - coop
    - distinguished
    - fellow
    - student

  # Phrases in a job description that indicate a senior role
  senior_phrases:
    - "5+ years"
    - "6+ years"
    - "7+ years"
    - "8+ years"
    - senior engineer
    - senior developer
    - senior scientist
    - lead engineer
    - staff engineer
    - principal engineer

# ── experience ────────────────────────────────────────────────────────────────
experience:
  max_years: 5
  phd_patterns:
    - "ph.d"
    - phd
    - doctorate
    - doctoral degree

